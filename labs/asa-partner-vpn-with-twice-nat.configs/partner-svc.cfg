hostname partner-svc
USERNAME=cisco
PASSWORD=cisco
ip link set eth0 up
ip addr add 198.51.100.10/24 dev eth0
ip route add default via 198.51.100.1
# The "service": a TCP banner on 8080 that also reports who connected,
# so the client side can see which pool address the partner saw.
( while true; do nc -l -p 8080 -e sh -c 'echo "partner-svc 198.51.100.10: hello"; netstat -tn 2>/dev/null | grep ":8080 .*ESTABLISHED"'; done ) >/dev/null 2>&1 &
