  - boot_disk_size: null
    configuration:
      - name: day0-config
        content: |-
          hostname asa-local
          interface GigabitEthernet0/0
           nameif inside
           security-level 100
           ip address 192.168.10.1 255.255.255.0
           no shutdown
          !
          interface GigabitEthernet0/1
           nameif outside
           security-level 0
           ip address 203.0.113.1 255.255.255.252
           no shutdown
          !
          object network LAN-HOSTS
           subnet 192.168.10.0 255.255.255.0
          ! A dynamic NAT pool must be a range object (one host would make it PAT); 9.23 rejects a
          ! subnet object here with "Subnet can not be used as mapped source in
          ! dynamic NAT policy". The range spans the whole /28, all 16 addresses,
          ! since the pool is routed through the tunnel and never sits on a wire.
          object network SNAT-POOL
           range 192.0.2.16 192.0.2.31
          object network SNAT-POOL-NET
           subnet 192.0.2.16 255.255.255.240
          object network PARTNER-SVC-MAPPED
           host 10.200.0.10
          object network PARTNER-SVC-REAL
           host 198.51.100.10
          !
          ! Source: LAN hosts leave as an address from the /28.
          ! Destination: the LAN dials 10.200.0.10, the partner receives 198.51.100.10.
          nat (inside,outside) source dynamic LAN-HOSTS SNAT-POOL destination static PARTNER-SVC-MAPPED PARTNER-SVC-REAL
          !
          ! Encryption domain, written in post-NAT addresses.
          access-list PARTNER-VPN extended permit ip object SNAT-POOL-NET object PARTNER-SVC-REAL
          !
          route outside 0.0.0.0 0.0.0.0 203.0.113.2 1
          !
          crypto ikev2 policy 10
           encryption aes-256
           integrity sha256
           group 20
           prf sha256
           lifetime seconds 86400
          crypto ikev2 enable outside
          !
          crypto ipsec ikev2 ipsec-proposal AES256-SHA256
           protocol esp encryption aes-256
           protocol esp integrity sha-256
          !
          crypto map OUTSIDE-MAP 10 match address PARTNER-VPN
          crypto map OUTSIDE-MAP 10 set pfs group20
          crypto map OUTSIDE-MAP 10 set peer 203.0.113.2
          crypto map OUTSIDE-MAP 10 set ikev2 ipsec-proposal AES256-SHA256
          crypto map OUTSIDE-MAP 10 set security-association lifetime seconds 3600
          crypto map OUTSIDE-MAP interface outside
          !
          tunnel-group 203.0.113.2 type ipsec-l2l
          tunnel-group 203.0.113.2 ipsec-attributes
           ikev2 remote-authentication pre-shared-key LabOnly-Change-Me-1
           ikev2 local-authentication pre-shared-key LabOnly-Change-Me-1
          !
          end
    cpu_limit: null
    cpus: null
